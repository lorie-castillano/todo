# GitHub Actions CI Workflow
#
# Triggers:
# - Every pull request (catches bugs before merge)
# - Push to main (verifies trunk health)
#
# Jobs run in PARALLEL for speed:
#   lint           → ESLint code quality (frontend)
#   typecheck      → TypeScript type errors (frontend + backend)
#   test           → Vitest unit tests (frontend)
#   build          → Vite production build verification (frontend)
#   backend-check  → TypeScript type errors (backend)
#
# All jobs must pass before a PR can be merged (configured via branch protection).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same PR.
# Saves minutes and gives faster feedback on the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────
  # Frontend — Lint: Catch code quality issues
  # ───────────────────────────────────────────────────────────
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ───────────────────────────────────────────────────────────
  # Frontend — Typecheck: Catch TypeScript errors
  # ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

  # ───────────────────────────────────────────────────────────
  # Frontend — Test: Run Vitest test suite
  # ───────────────────────────────────────────────────────────
  test:
    name: Tests (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm run test:run -- --reporter=verbose

  # ───────────────────────────────────────────────────────────
  # Frontend — Build: Verify production bundle compiles
  # ───────────────────────────────────────────────────────────
  build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────
  # Backend — Typecheck: Catch TypeScript errors
  # ───────────────────────────────────────────────────────────
  backend-check:
    name: TypeScript (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript compiler check
        run: npm run typecheck

  # ───────────────────────────────────────────────────────────
  # Preview Deploy: Deploy PR to Vercel for review
  # Only runs on pull_request events (not on push to main).
  # Production deploys happen automatically via Vercel's GitHub integration.
  #
  # Required secrets (set in GitHub repo → Settings → Secrets):
  #   VERCEL_TOKEN       — from vercel.com/account/tokens
  #   VERCEL_ORG_ID      — from .vercel/project.json after `vercel link`
  #   VERCEL_PROJECT_ID  — from .vercel/project.json after `vercel link`
  # ───────────────────────────────────────────────────────────
  preview:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, backend-check]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (preview)
        id: deploy
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PREVIEW_URL=$(vercel deploy --token "$VERCEL_TOKEN" 2>&1 | grep -E '^https://' | tail -1)
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview deployed: $PREVIEW_URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deployment\n\n**URL:** ${{ steps.deploy.outputs.preview-url }}`
            })
