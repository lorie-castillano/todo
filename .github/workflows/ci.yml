# GitHub Actions CI Workflow
#
# Triggers:
# - Every pull request (catches bugs before merge)
# - Push to main (verifies trunk health)
#
# Jobs run in PARALLEL for speed:
#   lint      → ESLint code quality
#   typecheck → TypeScript type errors
#   test      → Vitest unit tests
#   build     → Vite production build verification
#
# All jobs must pass before a PR can be merged (configured via branch protection).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same PR.
# Saves minutes and gives faster feedback on the latest code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────
  # Lint: Catch code quality issues
  # ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Built-in npm cache — skips redundant downloads on subsequent runs
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is faster and stricter than `npm install` for CI:
        # - Requires exact package-lock.json match
        # - Deletes node_modules first (clean install)
        # - Fails if lockfile is out of sync
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ───────────────────────────────────────────────────────────
  # Typecheck: Catch TypeScript errors
  # ───────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

  # ───────────────────────────────────────────────────────────
  # Test: Run Vitest test suite
  # ───────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm run test:run -- --reporter=verbose
        # `test:run` (defined in package.json) uses `vitest run` to disable
        # watch mode — critical because CI processes must exit, not hang.
        # `--reporter=verbose` shows all test names for debugging failures.

  # ───────────────────────────────────────────────────────────
  # Build: Verify production bundle compiles
  # ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        # Save the build output so other workflows (e.g., deploy, a11y audit)
        # can download it without rebuilding. Artifacts auto-expire after 90 days.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────
  # Preview Deploy: Deploy PR to Vercel for review
  # Only runs on pull_request events (not on push to main).
  # Production deploys happen automatically via Vercel's GitHub integration.
  #
  # Required secrets (set in GitHub repo → Settings → Secrets):
  #   VERCEL_TOKEN       — from vercel.com/account/tokens
  #   VERCEL_ORG_ID      — from .vercel/project.json after `vercel link`
  #   VERCEL_PROJECT_ID  — from .vercel/project.json after `vercel link`
  # ───────────────────────────────────────────────────────────
  preview:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # `--prebuilt` is not used here — Vercel builds from source for simplicity.
          # For faster deploys, add `vercel-args: '--prebuilt'` and pass the dist artifact.
